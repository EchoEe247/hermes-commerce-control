name: Workstream C registry candidate validation

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cycle2/mcp-registry-0.1.3

      - name: Synchronize package-lock release version
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
          lock.version = '0.1.3';
          lock.packages[''].version = '0.1.3';
          fs.writeFileSync(path, JSON.stringify(lock, null, 2) + '\n');
          NODE

      - name: Validate server.json with current mcp-publisher
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          publisher_url="https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz"
          curl --fail --silent --show-error --location "$publisher_url" | tar xz mcp-publisher
          set +e
          ./mcp-publisher validate server.json > tmp/workstream-c-mcp-publisher-validation.txt 2>&1
          validation_status=$?
          set -e
          {
            printf '\nvalidator_exit=%s\n' "$validation_status"
            printf 'validated_at_utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'publisher_url=%s\n' "$publisher_url"
          } >> tmp/workstream-c-mcp-publisher-validation.txt
          printf '%s' "$validation_status" > /tmp/validation-status

      - name: Commit generated lockfile and validation receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json tmp/workstream-c-mcp-publisher-validation.txt
          git commit -m 'chore: validate MCP Registry release candidate'
          git push origin HEAD:cycle2/mcp-registry-0.1.3
          exit "$(cat /tmp/validation-status)"
